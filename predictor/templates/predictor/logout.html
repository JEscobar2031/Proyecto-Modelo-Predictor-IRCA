{% extends 'predictor/base.html' %}

{% block title %}Sesión Cerrada - Predictor IRCA{% endblock %}

{% block content %}
<!--
  VISTA DE CIERRE DE SESIÓN (logout.html)
  Pantalla de confirmación que se muestra después de cerrar sesión.
  Solo informa al usuario que la sesión terminó y ofrece un botón para volver al login.
  La lógica de cierre la maneja Django (LogoutView), esta plantilla es únicamente visual.
-->
<div class="login-container">
    <div class="login-card text-center">
        <i class="bi bi-check-circle-fill text-success" style="font-size: 3rem;"></i>
        <h3 class="mt-2">Sesión Cerrada</h3>
        <p class="text-muted">Has cerrado sesión correctamente.</p>
        <a href="{% url 'predictor:login' %}" class="btn btn-predecir text-white mt-3">
            <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión Nuevamente
        </a>
    </div>
</div>
{% endblock content %}
