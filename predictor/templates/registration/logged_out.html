{% extends 'predictor/base.html' %}

{% block title %}Sesión Cerrada - Predictor IRCA{% endblock %}

{% block content %}
<!--
  PLANTILLA DE RESERVA (registration/logged_out.html)
  Django busca por defecto la plantilla de logout en "registration/logged_out.html".
  Esta copia existe como respaldo si se usa la vista de logout estándar de Django.
  Contenido: mensaje de confirmación y enlace para volver al inicio de sesión.
  Nota: usa el nombre de URL global 'login', no el namespace 'predictor:login'.
-->
<div class="login-container">
    <div class="login-card text-center">
        <i class="bi bi-check-circle-fill text-success" style="font-size: 3rem;"></i>
        <h3 class="mt-2">Sesión Cerrada</h3>
        <p class="text-muted">Has cerrado sesión correctamente.</p>
        <a href="{% url 'login' %}" class="btn btn-predecir text-white mt-3">
            <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión Nuevamente
        </a>
    </div>
</div>
{% endblock content %}
